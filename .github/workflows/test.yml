name: Tests

on:
  push:
    branches:
      - "*"
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go.mod or go.sum not tidy — run 'go mod tidy' and commit the changes" && exit 1)

      - name: Go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Unit tests
        run: go test ./... -short -v

  acceptance-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          HOOKBASE_API_KEY: ${{ secrets.HOOKBASE_API_KEY }}
          HOOKBASE_API_URL: ${{ secrets.HOOKBASE_API_URL }}
        run: go test ./internal/resources/ -v -timeout 30m
