name: Tests

on:
  push:
    branches:
      - "*"
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Read the version from go.mod instead of restating it. The pinned "1.22.x" was
          # four releases behind the `go 1.25.0` directive; the build steps only survived it
          # because GOTOOLCHAIN=auto silently downloaded a newer toolchain, and golangci-lint
          # — which type-checks with the Go version it was *built* against, not the one on
          # PATH — had no such escape hatch.
          go-version-file: go.mod

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go.mod or go.sum not tidy — run 'go mod tidy' and commit the changes" && exit 1)

      - name: Go vet
        run: go vet ./...

      - name: Check gofmt
        # golangci-lint v2 runs no formatter unless a .golangci.yml asks for one, and there is no
        # .golangci.yml here — so eight files had drifted out of gofmt with the whole pipeline
        # green. `gofmt -l` prints the offenders and nothing else, hence the emptiness test.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd — run 'gofmt -w .' and commit:"
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, not "latest": `latest` is what broke this step. It resolves against
          # golangci-lint's releases, which moved on to the v2 line, while action v6 can only
          # drive v1 — and v1's newest build cannot type-check a `go 1.25.0` module anyway.
          # Action v9 drives v2; v2.14.0 is built with a Go newer than this module requires.
          version: v2.14.0

      - name: Unit tests
        run: go test ./... -short -v

  acceptance-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          HOOKBASE_API_KEY: ${{ secrets.HOOKBASE_API_KEY }}
          HOOKBASE_API_URL: ${{ secrets.HOOKBASE_API_URL }}
        run: go test ./internal/resources/ -v -timeout 30m
